<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galería de Fotos de Dulce</title>
    <link rel="stylesheet" href="scss/style.css">
    <!-- Favicon SVG en línea -->
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>❤️</text></svg>">
</head>

<body>

    <!-- Botón de cambio de tema -->
    <button class="theme-toggle" id="theme-toggle" aria-label="Cambiar tema" data-tooltip="Cambiar tema">
        <svg class="icon-moon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
        </svg>
        <svg class="icon-sun" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="5" />
            <line x1="12" y1="1" x2="12" y2="3" />
            <line x1="12" y1="21" x2="12" y2="23" />
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64" />
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78" />
            <line x1="1" y1="12" x2="3" y2="12" />
            <line x1="21" y1="12" x2="23" y2="12" />
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36" />
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22" />
        </svg>
    </button>

    <h1 class="animated-title">Mis Recuerdos con Dulce</h1>

    <div class="estanteria-fotos">
        <div class="estante" id="estante-fotos">
            <!-- Los portafotos se generarán aquí dinámicamente -->
        </div>
    </div>

    <!-- Contenedor para la vista de foto en grande (oculto por defecto) -->
    <div class="lightbox-overlay" id="lightbox" role="dialog" aria-modal="true" aria-labelledby="lightbox-caption">
        <!-- Botones de navegación -->
        <button class="btn-nav btn-anterior" id="btn-anterior" aria-label="Foto anterior"
            data-tooltip="Anterior (←)">&lt;</button>
        <div class="lightbox-content">
            <img src="" alt="Foto ampliada" id="lightbox-img">
        </div>
        <button class="btn-nav btn-siguiente" id="btn-siguiente" aria-label="Foto siguiente"
            data-tooltip="Siguiente (→)">&gt;</button>

        <!-- Barra inferior de acciones (optimizada para móvil) -->
        <div class="lightbox-bottom-bar">
            <div class="lightbox-info">
                <p class="lightbox-caption" id="lightbox-caption"></p>
                <div class="lightbox-counter" id="lightbox-counter"></div>
            </div>
            <div class="lightbox-actions">
                <button class="btn-lightbox btn-icon" id="btn-compartir" aria-label="Compartir"
                    data-tooltip="Compartir"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
                        fill="currentColor" width="24" height="24">
                        <path
                            d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92s2.92-1.31 2.92-2.92-1.31-2.92-2.92-2.92z">
                        </path>
                    </svg></button>
                <a href="#" class="btn-lightbox btn-lightbox--primary btn-icon" id="btn-descargar" download
                    aria-label="Descargar" data-tooltip="Descargar"><svg xmlns="http://www.w3.org/2000/svg"
                        viewBox="0 0 24 24" fill="currentColor" width="24" height="24">
                        <path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"></path>
                    </svg></a>
                <button class="btn-lightbox" id="btn-cerrar-lightbox" data-tooltip="Cerrar (Esc)">Volver</button>
            </div>
        </div>
    </div>

    <!-- Librerías de terceros -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
    <script type="module" src="script.js"></script>
</body>

</html>
